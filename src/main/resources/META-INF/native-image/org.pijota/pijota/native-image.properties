# Build flags required for a *working* pijota native image, embedded here so that ANY native-image build picks them up
# automatically: the Maven `native` profile, a bare `native-image -jar target/pijota-*.jar`, or
# `jbang app install --native ...`, with no external arguments. Correctness only; size/CPU tuning (-Os, -march, PGO)
# stays in the pom's `native` profile, which is this project's distribution build.
#
#   --no-fallback                 never emit a JVM-wrapped fallback image; fail loudly if something is unreachable.
#   --enable-url-protocols=https  provider APIs are HTTPS.
#   --initialize-at-build-time    Jackson must be build-time-initialized: a build-time object (static ObjectMappers /
#                                 the anthropic model) holds an ObjectMapper in the image heap, which fails under the
#                                 default run-time init. This is the documented Jackson-on-native approach.
#   --initialize-at-run-time      pijota + logging must initialize at run time.
#   (no -H:+EnableSignalHandling) GraalVM's own SIGINT dispatch overrides JLine's terminal INT handler, breaking
#                               double-Ctrl+C-to-exit; and it intercepts SIGTSTP so sun.misc.Signal can't deliver a
#                               real stop anyway. Suspend therefore forks `kill -TSTP <pid>`, which needs no
#                               registered disposition. The SIGCONT tty repair does use sun.misc.Signal.handle, and
#                               chains to whatever held CONT before it; verified working in the native binary under
#                               tmux (Ctrl+Z, fg, then Enter submits rather than inserting a newline).
#
# reachability-metadata.json carries a hand-added entry for JLine's ExecTerminalProvider. JLine ships its own
# reachability config, but native-image reads only the one whose artifact name matches the image, so JLine's is never
# consulted and the provider it registers -- the only one that can set raw mode in a native image -- would be absent.
# Without it the binary runs cooked: control characters echo literally, Ctrl+Z does nothing, Backspace breaks. The file
# is strict JSON with no comment syntax, which is why this note lives here.
Args = -H:+UnlockExperimentalVMOptions -H:Name=pj \
       --no-fallback \
       --enable-url-protocols=https \
       --initialize-at-build-time=com.fasterxml.jackson,dev.langchain4j.model.anthropic \
       --initialize-at-run-time=org.pijota,org.slf4j,ch.qos.logback
