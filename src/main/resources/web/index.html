<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="description" content="pijota — interactive coding agent">
<meta name="theme-color" content="#131316">
<title>pijota</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23131316'/%3E%3Ctext x='16' y='23' font-family='-apple-system,Segoe UI,sans-serif' font-size='20' font-weight='700' fill='%234d8dfb' text-anchor='middle'%3Ej%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" id="hljs-theme" href="/vendor/github-dark.min.css">
<!-- vendored locally (see web/vendor/) so the UI renders offline with no CDN; deferred so they load in parallel
     without blocking first paint; app init waits for DOMContentLoaded -->
<script defer src="/vendor/marked.min.js"></script>
<script defer src="/vendor/highlight.min.js"></script>
<script defer src="/vendor/purify.min.js"></script>
<style>
  :root {
    /* a calm neutral dark (vs GitHub's cool blue-black); surfaces step up bg→code→panel→panel-2 for clean depth */
    --bg: #131316; --panel: #1c1c20; --panel-2: #26262c; --border: #34343c;
    --text: #ededf1; --muted: #9a9aa6; --accent: #4d8dfb; --accent-soft: #4d8dfb26;
    --user: #4d8dfb; --user-bg: #4d8dfb33; --ok: #4ac26b; --err: #f9736b; --think: #b08cff;
    --code-bg: #17171b; --overlay: #000a; --shadow-color: #00000073; --err-text: #ffb4ae; --warn-text: #ffd9a8;
    --code-inline-bg: #ffffff14;
    --radius: 12px; --col: 768px; /* shared content-column width: transcript + composer + menus align to it */
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  :root[data-theme="light"] {
    /* a soft warm off-white (vs stark #fff); cards/panels read as white above it, code sits a touch below */
    --bg: #faf9f7; --panel: #ffffff; --panel-2: #efeeea; --border: #e4e2dc;
    --text: #2a2a28; --muted: #6b6b64; --accent: #2f6fed; --accent-soft: #2f6fed14;
    --user: #2f6fed; --user-bg: #2f6fed1f; --ok: #1a7f37; --err: #d83a36; --think: #7b53d6;
    --code-bg: #f6f5f1; --overlay: rgba(40,40,36,.35); --shadow-color: rgba(40,40,36,.16);
    --err-text: #b42318; --warn-text: #8a6100; --code-inline-bg: #00000010;
  }
  body { transition: background .2s, color .2s; }
  * { box-sizing: border-box; }
  /* 100dvh tracks the *visible* viewport (mobile URL bar + soft keyboard), with 100% as the fallback; together with
     interactive-widget=resizes-content this keeps the composer above the keyboard instead of behind it. */
  html, body { height: 100%; height: 100dvh; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 10px; padding: 12px 20px;
    border-bottom: 1px solid var(--border); background: var(--panel); flex: none;
  }
  header .logo { font-weight: 700; letter-spacing: .5px; font-size: 16px; }
  header .logo b { color: var(--accent); }
  header .spacer { flex: 1; }
  /* connection: red (down) ↔ green (alive), both with a glow so the state pops; the `error` handler removes `on`. */
  .dot { width: 9px; height: 9px; flex: none; aspect-ratio: 1; border-radius: 50%; background: var(--err); box-shadow: 0 0 8px var(--err); transition: background .3s, box-shadow .3s; }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.busy { background: var(--accent); box-shadow: none; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  ::selection { background: var(--accent-soft); } /* branded text selection */
  main { flex: 1; overflow-y: auto; scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  main::-webkit-scrollbar { width: 10px; }
  main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
  main::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  main::-webkit-scrollbar-track { background: transparent; }
  /* keyboard focus rings for in-message interactive elements (links + the various copy buttons) */
  .bubble a:focus-visible, .copy-btn:focus-visible, .answer-copy:focus-visible, .think-copy:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px;
  }
  #thread { max-width: var(--col); margin: 0 auto; padding: 28px 20px 8px; display: flex; flex-direction: column; gap: 22px; }
  /* empty conversation: greeting + composer centred in the viewport (drops to the bottom once messages flow) */
  .greeting { display: none; text-align: center; max-width: var(--col); margin: 0 auto 28px; }
  .greeting .mark { font-size: 34px; font-weight: 700; letter-spacing: .5px; }
  .greeting .mark b { color: var(--accent); }
  .greeting .hint { margin-top: 12px; color: var(--muted); font-size: 14px; }
  .greeting .hint code { font-family: var(--mono); font-size: 12.5px; background: var(--code-inline-bg); padding: 1px 6px; border-radius: 5px; }
  /* clickable example prompts on the empty landing — send on click */
  .examples { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .example { font-family: var(--sans); font-size: 13px; color: var(--muted); background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; padding: 7px 14px; cursor: pointer; transition: color .12s, border-color .12s, background .12s; }
  .example:hover { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
  /* the model chip is a shortcut to the switcher */
  .badge-chip.model { cursor: pointer; }
  .badge-chip.model:hover { border-color: var(--accent); color: var(--text); }
  body.empty main { display: none; }
  body.empty .composer { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  body.empty .greeting { display: block; }

  /* transient status toasts (ephemeral feedback like "started a new conversation") — never enters the transcript */
  #toasts { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
  .toast { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; font-size: 13px; box-shadow: 0 6px 24px var(--shadow-color); max-width: min(520px, 90vw); animation: toastin .18s ease both; }
  .toast.alert { color: var(--warn-text); border-color: #d29922; background: var(--panel-2); }
  .toast.out { animation: toastout .25s ease forwards; }
  @keyframes toastin { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  @keyframes toastout { to { opacity: 0; transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { .toast, .toast.out { animation: none; } }

  .msg { display: flex; flex-direction: column; gap: 6px; animation: rise .22s ease both; }
  #thread.replaying .msg { animation: none; } /* replayed history appears at once — don't rise the whole transcript on (re)connect */
  @media (prefers-reduced-motion: reduce) { .msg { animation: none; } } /* must follow the .msg rule to win on source order */
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  /* Per-message meta is an ABSOLUTE overlay faded in on hover, so revealing it never reflows the thread (no content
     jump). The COPY button overlays a corner; the TIMESTAMP lives in the OUTER gutter beside the centred column — so
     time and copy never collide, and neither overlaps the message text. */
  .msg { position: relative; }
  .msg-time { position: absolute; top: 11px; font-size: 10.5px; line-height: 1.4; color: var(--muted); opacity: 0; pointer-events: none; transition: opacity .12s; white-space: nowrap; }
  .msg:hover .msg-time, .msg:focus-within .msg-time { opacity: .55; }
  .msg.assistant .msg-time { right: 100%; margin-right: 16px; } /* left outer gutter (content reads left→right) */
  .msg.user .msg-time { left: 100%; margin-left: 16px; }        /* right outer gutter (beside the right-aligned bubble) */
  /* too little gutter (narrow window) or touch (no hover): drop the hover-only timestamp rather than clip/overlap it */
  @media (max-width: 900px), (hover: none) { .msg-time { display: none; } }
  .answer-copy { font-family: var(--sans); font-size: 11px; line-height: 1.4; color: var(--muted); background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; cursor: pointer; transition: opacity .12s, color .12s, border-color .12s; }
  .answer-copy:hover { color: var(--text); border-color: var(--accent); }
  /* response copy floats at the answer's top-right (reachable, never pinned under the composer like a row below) */
  .answer { position: relative; }
  .answer-copy { position: absolute; top: 2px; right: 2px; opacity: 0; }
  .msg.assistant:hover .answer-copy, .answer-copy:focus-visible { opacity: 1; }
  .activity { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; padding: 3px 0; }
  .activity::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: activityPulse 1s ease-in-out infinite; }
  @keyframes activityPulse { 0%,100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.2); } }
  .bubble { padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--panel); line-height: 1.65; overflow-wrap: anywhere; }
  .msg.user { align-items: flex-end; }
  .msg.user .bubble { background: var(--user-bg); border-color: transparent; max-width: 82%; border-radius: 16px 16px 4px 16px; } /* clean theme-aware pill */
  /* assistant messages render flat (no nested box) so code blocks are the only boxed elements */
  .msg.assistant .bubble { background: transparent; border: none; padding: 0; border-radius: 0; }
  /* an assistant turn reads as one coherent reply: a subtle brand-accent rail down its left edge, and its
     fragments (thinking, answer, each tool card) pulled together instead of floating a full gap apart */
  .msg.assistant { border-left: 2px solid color-mix(in srgb, var(--accent) 22%, transparent); padding-left: 16px; }
  .msg.assistant + .msg.assistant { margin-top: -14px; }
  .msg.error .bubble { border-color: var(--err); color: var(--err-text); background: color-mix(in srgb, var(--err) 12%, transparent); }
  .msg.custom .bubble { background: transparent; border-style: dashed; color: var(--muted); font-size: 13px; }

  /* markdown */
  .bubble p:first-child { margin-top: 0; } .bubble p:last-child { margin-bottom: 0; }
  /* code block: a bordered card with a header bar (language + copy) above the scrollable code — like ChatGPT/Claude */
  .codeblock { margin: .85em 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--code-bg); }
  .codebar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 6px 4px 14px; background: var(--panel-2); border-bottom: 1px solid var(--border); }
  .codebar .lang { font-family: var(--sans); font-size: 11px; letter-spacing: .4px; text-transform: lowercase; color: var(--muted); }
  .copy-btn { font-family: var(--sans); font-size: 11px; color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 3px 9px; cursor: pointer; }
  .copy-btn:hover { color: var(--text); background: var(--panel); border-color: var(--border); }
  .bubble pre { background: var(--code-bg); padding: 12px 14px; overflow-x: auto; font-family: var(--mono); font-size: 13px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .codeblock pre { margin: 0; } /* the card owns the border/radius/fill; the pre just scrolls */
  /* force a thin, space-reserving classic scrollbar (overrides the OS overlay bar that draws teal over the code) */
  .bubble pre::-webkit-scrollbar { height: 8px; }
  .bubble pre::-webkit-scrollbar-track { background: transparent; }
  .bubble pre::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  /* the hljs theme paints its own bg + padding on the code element — neutralize it so the block is one clean fill */
  .bubble pre code, .bubble pre .hljs { background: transparent; padding: 0; }
  .bubble code { font-family: var(--mono); font-size: 13px; }
  .bubble :not(pre) > code { background: var(--code-inline-bg); padding: 2px 6px; border-radius: 5px; }
  .bubble table { border-collapse: collapse; width: 100%; margin: 8px 0; }
  /* a wide table scrolls horizontally instead of cramming/overflowing on a narrow (phone) screen */
  .tablewrap { overflow-x: auto; margin: 8px 0; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .tablewrap table { margin: 0; width: max-content; min-width: 100%; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .bubble th { background: var(--panel-2); }
  .bubble blockquote { margin: 8px 0; padding-left: 12px; border-left: 3px solid var(--border); color: var(--muted); }
  .bubble a { color: var(--accent); text-decoration: none; } .bubble a:hover { text-decoration: underline; }
  .bubble p { margin: .6em 0; }
  .bubble h1, .bubble h2, .bubble h3, .bubble h4 { line-height: 1.3; margin: 1.1em 0 .5em; font-weight: 600; }
  .bubble h1 { font-size: 1.4em; } .bubble h2 { font-size: 1.25em; } .bubble h3 { font-size: 1.1em; }
  .bubble ul, .bubble ol { padding-left: 1.4em; margin: .5em 0; }
  .bubble li { margin: .25em 0; }
  .bubble li::marker { color: var(--muted); }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 1.2em 0; }

  details.think, details.tool { border: 1px solid var(--border); border-radius: 10px; background: var(--panel-2); overflow: hidden; }
  details.think { border-color: color-mix(in srgb, var(--think) 30%, transparent); }
  details.think, details.tool { transition: border-color .15s; }
  details > summary { cursor: pointer; padding: 9px 14px; font-size: 13px; user-select: none; display: flex; align-items: center; gap: 8px; list-style: none; border-radius: 10px; transition: background .12s; }
  details > summary:hover { background: var(--accent-soft); }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
  details[open] > summary::before { transform: rotate(90deg); }
  /* thinking is a quiet "peek if curious" affordance, not a headline: no box, a small muted summary, so the answer
     below is the hero. (tool cards keep their box — they carry results worth scanning.) */
  details.think { border: none; background: transparent; border-radius: 0; overflow: visible; }
  details.think > summary { color: var(--muted); font-size: 12px; padding: 4px 2px; opacity: .7; border-radius: 4px; }
  details.think > summary:hover { background: transparent; color: var(--text); opacity: 1; }
  details.think[open] > summary { opacity: 1; }
  .think .body { padding: 2px 0 8px 18px; color: var(--muted); font-style: italic; white-space: pre-wrap; line-height: 1.55; }
  /* copy the reasoning straight from the thinking block; revealed on hover/while open, separate from the output copy */
  .think-copy { margin-left: auto; font-family: var(--sans); font-style: normal; font-size: 11px; line-height: 1.4; color: var(--muted); background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 1px 7px; cursor: pointer; opacity: 0; transition: opacity .12s, color .12s, border-color .12s; }
  details.think > summary:hover .think-copy, details.think[open] > summary .think-copy { opacity: 1; }
  .think-copy:hover { color: var(--text); border-color: var(--accent); }
  @media (hover: none) { .think-copy { opacity: 1; } }
  /* tactile press feedback shared by every copy button (harmonizes their transitions too) */
  .copy-btn, .answer-copy, .think-copy { transition: opacity .12s, color .12s, border-color .12s, transform .1s; }
  .copy-btn:active, .answer-copy:active, .think-copy:active { transform: scale(.94); }
  .tool .name { font-family: var(--mono); color: var(--accent); flex: none; }
  /* the concise descriptor (path / command / pattern) next to the tool name; ellipsizes, full text on expand */
  .tool .detail { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool .section { padding: 0 14px 12px; }
  /* tool args as a clean key/value list instead of a raw JSON blob (and args already shown in the header are dropped) */
  .arglist { display: flex; flex-direction: column; gap: 3px; margin-top: 2px; }
  .argrow { display: flex; gap: 8px; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; }
  .argkey { color: var(--muted); flex: none; }
  .argval { color: var(--text); overflow-wrap: anywhere; }
  /* readable rendering of the question tool's args (vs raw JSON) */
  .qcard { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
  .qcard-title { font-weight: 600; margin-bottom: 4px; }
  .qcard-opt { color: var(--muted); font-size: 13px; padding-left: 4px; line-height: 1.5; }
  .tool pre { margin: 6px 0 0; background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; max-height: 360px; overflow-y: auto; }
  .tool.err > summary .name { color: var(--err); }
  .tool .badge { margin-left: auto; font-size: 11px; padding: 1px 8px; border-radius: 20px; background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
  .tool.err .badge { background: color-mix(in srgb, var(--err) 16%, transparent); color: var(--err); }
  /* while a tool runs, the whole "running…" pill breathes — an obvious, opacity-only (vestibular-safe) cue. Under
     prefers-reduced-motion the global rule below neutralizes it, leaving a static "running…" label (still clear). */
  .tool .badge.running { animation: pulse 1.3s ease-in-out infinite; }

  /* jump-to-latest, shown only when scrolled up */
  .scrollbtn {
    position: fixed; left: 50%; bottom: 92px; z-index: 20;
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--panel);
    color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 17px; box-shadow: 0 4px 14px var(--shadow-color);
    /* fade + a small rise on appear (display:none can't animate) — visibility keeps it out of tab order while hidden */
    opacity: 0; visibility: hidden; pointer-events: none; transform: translateX(-50%) translateY(8px);
    transition: opacity .18s ease, transform .18s ease, visibility .18s, border-color .15s;
  }
  .scrollbtn.show { opacity: 1; visibility: visible; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  body.empty .scrollbtn { opacity: 0; visibility: hidden; pointer-events: none; } /* never on the hero, even with a stale .show */
  .scrollbtn:hover { border-color: var(--accent); background: var(--panel-2); }
  .scrollbtn:active { transform: translateX(-50%) scale(.92); }
  @media (prefers-reduced-motion: reduce) { /* keep the fade, drop the rise/scale motion */
    .scrollbtn { transition: opacity .15s, visibility .15s, border-color .15s; transform: translateX(-50%); }
    .scrollbtn.show { transform: translateX(-50%); }
    .scrollbtn:active { transform: translateX(-50%); }
  }

  /* the send button keeps its fixed slot (↑ send), disabled when empty; Stop is the separate round button below */
  .act:disabled { opacity: .4; cursor: default; }
  /* Stop: a round red button floating just above the send button, shown ONLY while streaming (.show) */
  /* same size + right offset as the send button, so it stacks directly above it (centres aligned) */
  /* Stop is anchored to the send button's own wrapper (left:0, same width) so it's pixel-aligned above it on every screen */
  .sendwrap { position: relative; flex: none; align-self: flex-end; display: flex; }
  /* +18px clears the send button's ~8px inset inside the box, leaving ~10px between the Stop and the prompt box */
  /* slightly larger than the 34px send (left:-2 re-centres the 38px button over it) so it stands out while streaming */
  .stopbtn { display: none; position: absolute; left: -2px; bottom: calc(100% + 16px); width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--err); color: #fff; font-size: 0; cursor: pointer; align-items: center; justify-content: center; transition: transform .1s, filter .12s; }
  /* the stop icon is a pixel-centred CSS square (the "■" glyph sits off-centre in its line-box); font-size:0 hides it */
  .stopbtn::before { content: ""; width: 14px; height: 14px; border-radius: 3px; background: currentColor; }
  .stopbtn.show { display: flex; animation: stopGlow 1.8s ease-out infinite; } /* subtle "live" beacon while streaming */
  .stopbtn:hover { filter: brightness(1.08); }
  .stopbtn:active { transform: scale(.92); }
  /* an expanding, fading red ring — signals the turn is live and abortable, without being loud */
  @keyframes stopGlow {
    0%   { box-shadow: 0 4px 14px var(--shadow-color), 0 0 0 0 color-mix(in srgb, var(--err) 55%, transparent); }
    70%  { box-shadow: 0 4px 16px var(--shadow-color), 0 0 0 11px color-mix(in srgb, var(--err) 0%, transparent); }
    100% { box-shadow: 0 4px 14px var(--shadow-color), 0 0 0 0 color-mix(in srgb, var(--err) 0%, transparent); }
  }
  @media (prefers-reduced-motion: reduce) { .stopbtn.show { animation: none; box-shadow: 0 4px 14px var(--shadow-color); } }
  /* pending image attachments (paste / drop) shown above the input as removable thumbnails */
  .attachments { display: flex; flex-wrap: wrap; gap: 8px; max-width: var(--col); margin: 0 auto 8px; }
  .attachments:empty { display: none; }
  .thumb { position: relative; width: 58px; height: 58px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .rm { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; border: none; background: var(--overlay); color: #fff; font-size: 11px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  /* non-image attachment shown as a named chip (in the composer and in sent bubbles) */
  .filechip { display: inline-flex; align-items: center; gap: 6px; max-width: 220px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); font-size: 12.5px; }
  .filechip .ficon { flex: none; } .filechip .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .filechip .rm { flex: none; border: none; background: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 0 1px; }
  .filechip .rm:hover { color: var(--text); }
  .msg .filerow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .msg.user .filerow { justify-content: flex-end; }
  /* the attach (+) button, beside Send — only shown (.show) when the active model accepts media */
  .attach { display: none; flex: none; align-self: flex-end; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: var(--panel-2); color: var(--muted); align-items: center; justify-content: center; cursor: pointer; transition: color .12s, border-color .12s, transform .1s; }
  .attach.show { display: flex; }

  textarea#input {

    flex: 1; resize: none; max-height: 200px; min-height: 22px; padding: 0; display: block;

  button.act {
    flex: none; border: none; border-radius: 50%; width: 34px; height: 34px; align-self: flex-end;

  .slashmenu .item.sel, .slashmenu .item:hover { background: var(--accent-soft); }

     shrink below its content so the ellipsis actually kicks in instead of overflowing on a narrow phone) */
  .slashmenu .item .cmd { flex: none; font-family: var(--mono); color: var(--accent); font-size: 13px; white-space: nowrap; }
  .slashmenu .item .desc { flex: 1; min-width: 0; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg.custom .bubble.command { font-family: var(--mono); color: var(--accent); border-style: solid; border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .badges { display: flex; gap: 6px; align-items: center; max-width: 45vw; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg,#000 calc(100% - 18px),transparent); mask-image: linear-gradient(90deg,#000 calc(100% - 18px),transparent); }
  .badges::-webkit-scrollbar { display: none; }
  .badge-chip { font-size: 11.5px; padding: 2px 9px; border-radius: 20px; background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .badge-chip.model { color: var(--text); font-family: var(--mono); }

  /* theme toggle */
  .icon-btn { background: none; border: 1px solid transparent; border-radius: 8px; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 4px 8px; transition: color .15s, border-color .15s; }
  .icon-btn:hover { color: var(--text); border-color: var(--border); }

  .modal { position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; width: min(440px, 90vw); box-shadow: 0 18px 50px var(--shadow-color); animation: modalIn .2s cubic-bezier(.22,.61,.36,1) both; }
  .modal-close { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; padding: 0; border: none; border-radius: 8px; background: transparent; color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer; transition: color .12s, background .12s; }

  .modal.finder { width: min(560px, 92vw); }
  .modal h3 { margin: 0 0 16px; padding-right: 28px; font-size: 16px; }
  .modal button, .modal input { font-family: var(--sans); font-size: 14px; }
  .modal .opt { text-align: left; padding: 10px 14px; border-radius: 9px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); cursor: pointer; transition: border-color .12s, background .12s; }
  .modal .opt:hover { border-color: var(--accent); background: var(--accent-soft); }
  .modal .opt:active { transform: scale(.98); }
  .modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  /* dialog actions are text pills, not the composer's round icon button (.act is 34px circular) */

  .qform { max-height: 56vh; overflow-y: auto; margin: 0 -4px; padding: 4px 4px 10px; }
  .qjump { position: absolute; right: 6px; bottom: 6px; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font-size: 15px; cursor: pointer; display: none; align-items: center; justify-content: center; box-shadow: 0 3px 10px var(--shadow-color); }

  .qblock { margin: 0 0 16px; } .qblock:last-child { margin-bottom: 0; }
  .qheader { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 3px; }
  .qtext { margin-bottom: 8px; }

  .modal .qopt.on { border-color: var(--accent); background: var(--accent-soft); }
  .qinput { margin-top: 6px; }

  .finder-item { flex: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background .12s; }

    .badges::-webkit-scrollbar { display: none; }

    .greeting .mark { font-size: 24px; }
    .composer { padding: 6px 10px 12px; }

<body>
  <header>
    <span class="logo">pi<b>jota</b></span>
    <span class="dot" id="conn" title="connection"></span>
    <span class="spacer"></span>
    <span class="badges" id="badges"></span>
    <button class="icon-btn" id="theme-toggle" title="Toggle light / dark" aria-label="Toggle light or dark theme"></button>
  </header>
  <main id="main"><div id="thread" role="log" aria-live="polite" aria-atomic="false" aria-label="Conversation"></div></main>
  <div id="toasts" aria-live="polite"></div>
  <button class="scrollbtn" id="scrollbtn" title="Scroll to latest" aria-label="Scroll to latest">↓</button>
  <div class="composer">
    <div class="greeting" id="greeting">
      <div class="mark">pi<b>jota</b></div>
      <div class="hint">Ask anything · type <code>/</code> for commands · <span id="palette-key">⌘K</span> for the palette</div>
      <div class="hint" id="model-hint"></div>
      <div class="examples" id="examples">
        <button type="button" class="example">Explain what this project does</button>
        <button type="button" class="example">Write a bash one-liner to find the 5 largest files here</button>
        <button type="button" class="example">Summarize the recent git history</button>
      </div>
    </div>
    <div class="slashmenu" id="slash"></div>
    <div class="attachments" id="attachments"></div>
    <div class="inner">
      <textarea id="input" placeholder="Message pijota…" rows="1" aria-label="Message pijota"></textarea>
      <button class="attach" id="attach" title="Attach a file" aria-label="Attach a file"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
      <span class="sendwrap">
        <button class="act" id="send" title="Send" aria-label="Send"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19V7M6 13l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="stopbtn" id="stop" title="Stop" aria-label="Stop generating">■</button>
      </span>
    </div>
  </div>

<script>
window.addEventListener("DOMContentLoaded", () => {
  "use strict";
  // The pairing token (?t=…) is now pinned as a cookie by the server — drop it from the address bar so the secret
  // doesn't linger in history or get re-shared. (Server serves the page directly; no redirect, so this is robust.)
  if (location.search) history.replaceState(null, "", location.pathname);
  const $ = s => document.querySelector(s);
  const thread = $("#thread"), main = $("#main"), input = $("#input"), sendBtn = $("#send");
  const stopBtn = $("#stop");
  // phones: Enter = newline, the button sends (no Shift/Ctrl). Keyed off (hover: none) — the single touch signal the
  // rest of this file already uses — so the Enter behaviour and the hover-only copy buttons agree on every device.
  const isTouch = matchMedia("(hover: none)").matches;
  // Apple keyboards use ⌘, everything else Ctrl — the palette binding accepts both (metaKey || ctrlKey); this only
  // picks which one we *show*. userAgentData.platform when present (navigator.platform is deprecated), else the UA.
  const isMac = /mac|iphone|ipad|ipod/i.test((navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || navigator.userAgent);
  $("#palette-key").textContent = isMac ? "⌘K" : "Ctrl-K";
  const conn = $("#conn"), badgesEl = $("#badges"), slash = $("#slash"), modelHint = $("#model-hint");

  // empty conversation → centered greeting + composer; first message drops it to the bottom (auto-tracked).
  // The composer glides between the two positions via a FLIP: measure the input's box before and after the
  // layout flip, then animate the inverse transform back to zero (GPU transform only, no layout thrash).
  const composerInner = $(".composer .inner");
  const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  let isEmpty = null; // null until first sync, so the initial state doesn't animate
  function setEmpty(empty) {
    if (empty === isEmpty) return;
    const animate = isEmpty !== null && !reduceMotion;
    const first = animate ? composerInner.getBoundingClientRect().top : 0;
    document.body.classList.toggle("empty", empty);
    if (animate) {
      const dy = first - composerInner.getBoundingClientRect().top;
      if (dy) composerInner.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }],
                                    { duration: 420, easing: "cubic-bezier(.22,.61,.36,1)" });
    }
    isEmpty = empty;
  }
  const trackEmpty = () => setEmpty(thread.childElementCount === 0);
  new MutationObserver(trackEmpty).observe(thread, { childList: true });
  trackEmpty();
  const themeBtn = $("#theme-toggle"), hljsTheme = $("#hljs-theme");

  // ---- theme (light / dark) ----
  const HLJS = {
    dark: "/vendor/github-dark.min.css",
    light: "/vendor/github.min.css",
  };
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    themeBtn.textContent = t === "light" ? "☾" : "☀"; // the mode you'll switch to
    hljsTheme.href = HLJS[t] || HLJS.dark;
    // keep the mobile browser chrome in sync with the active theme
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = getComputedStyle(document.body).getPropertyValue("--bg").trim() || meta.content;
    try { localStorage.setItem("pijota-theme", t); } catch (_) {}
  }
  function storedTheme() { try { return localStorage.getItem("pijota-theme"); } catch (_) { return null; } }
  applyTheme(storedTheme() || (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
  themeBtn.addEventListener("click", () => {
    applyTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");
    input.focus(); // an action button, not a focus target — return focus to the chat bar
  });
  let busy = false, live = null;           // live = current streaming assistant bubble
  let pendingFiles = [];                    // {mime, data(base64), url(dataURL), name, isImage} to attach
  let modalities = ["image", "pdf", "audio", "video"]; // media the current model accepts (from the stats event)
  let lastModel = null;                     // tracks model switches to warn when downgrading to a weaker model
  let currentModel = null;                   // provider/model shown as the first top-bar chip
  let activityBubble = null;                 // immediate placeholder while waiting for the model's first event
  const sessionModalities = new Set();      // media modalities actually present in this chat (gates the downgrade toast)
  const toolCards = new Map();             // tool-call id -> {wrap, result placeholder}
  let commands = [], menuItems = [], menuSel = -1;
  fetch("/commands").then(r => r.json()).then(c => commands = c).catch(() => {});

  // ---- markdown ----
  if (window.marked) marked.setOptions({ breaks: true, gfm: true });
  function renderMarkdown(el, text, settled = true) {
    text = text || "";
    if (window.marked && window.DOMPurify) {
      // Reassigning innerHTML rebuilds the DOM and collapses any in-flight text selection, so skip it when the
      // source text is unchanged. This matters at the stream→final transition: the final frame usually carries the
      // SAME content as the last streaming frame, and when it lands a frame later (so it doesn't coalesce into the
      // same rAF) the redundant re-render would wipe a selection the user just started on the finished message.
      if (el._md !== text) {
        el.innerHTML = DOMPurify.sanitize(marked.parse(text));
        el._md = text;
        el._hl = false;
      }
      // Syntax-highlight + add copy buttons only on a SETTLED render, and only once per content. During streaming
      // the innerHTML is rebuilt every frame, so highlighting each frame is wasted CPU (and the copy button would
      // flicker); code shows plain until the message settles, then colorizes once. One pass over <pre> for both.
      if (settled && !el._hl) {
        el._hl = true;
        el.querySelectorAll("pre").forEach(pre => {
          const code = pre.querySelector("code");
          if (code) { try { hljs.highlightElement(code); } catch (_) {} }
          decorateCodeBlock(pre, code);
        });
        el.querySelectorAll("table").forEach(t => { // wrap so a wide table scrolls on narrow screens
          if (t.parentNode && t.parentNode.classList.contains("tablewrap")) return;
          const w = document.createElement("div"); w.className = "tablewrap";
          t.parentNode.insertBefore(w, t); w.appendChild(t);
        });
      }
    } else {
      el.textContent = text;              // safe fallback if CDN unavailable
    }
  }
  // A "copy" button that writes getText() (read at click time) to the clipboard and flashes "copied".
  function copyButton(className, getText, title) {
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = className; btn.textContent = "copy";
    if (title) btn.title = title;
    btn.onclick = () => navigator.clipboard.writeText(getText() || "").then(() => {
      btn.textContent = "copied"; setTimeout(() => { btn.textContent = "copy"; }, 1200);
    }, () => {});
    return btn;
  }
  // Wrap a code block in a header bar (language label + always-visible copy), ChatGPT/Claude-style. The language is
  // read from the fence/hljs `language-xxx` class; undetected blocks just get an empty label (the copy stays useful).
  function decorateCodeBlock(pre, code) {
    if (pre.parentNode && pre.parentNode.classList.contains("codeblock")) return; // already decorated
    const m = code && /\blanguage-([\w+#.-]+)/.exec(code.className || "");
    const lang = m && m[1] && m[1] !== "plaintext" && m[1] !== "undefined" ? m[1] : "";
    const wrap = document.createElement("div"); wrap.className = "codeblock";
    const bar = document.createElement("div"); bar.className = "codebar";
    const tag = document.createElement("span"); tag.className = "lang"; tag.textContent = lang;
    bar.append(tag, copyButton("copy-btn", () => (code || pre).textContent, "Copy code"));
    pre.parentNode.insertBefore(wrap, pre);
    wrap.append(bar, pre);
  }
  // ---- scrolling ----
  // run fn, then keep the view pinned to the bottom if it already was (so streaming doesn't fight manual scroll-up)
  // "Stick to bottom" latch: follow the stream only while the user is parked at the bottom. The moment they scroll up
  // we stop yanking them down (so they can read mid-stream); they re-engage by scrolling back down or tapping ↓.
  function atBottom() { return main.scrollHeight - main.scrollTop - main.clientHeight < 60; }
  let stick = true, lastTop = 0;
  function toBottom() { main.scrollTop = main.scrollHeight; }
  function withAutoScroll(fn) { const r = fn(); if (stick) toBottom(); return r; }
  const scrollBtn = $("#scrollbtn");
  // Only a genuine upward scroll detaches from the bottom (so streaming re-renders / programmatic scrolls don't flip
  // it off); returning to the bottom re-attaches. The ResizeObserver then keeps us pinned as content grows.
  main.addEventListener("scroll", () => {
    const top = main.scrollTop;
    if (top < lastTop - 4) stick = false;
    else if (atBottom()) stick = true;
    lastTop = top;
    scrollBtn.classList.toggle("show", !stick);
  });
  scrollBtn.addEventListener("click", () => { stick = true; toBottom(); input.focus(); });
  new ResizeObserver(() => { if (stick) toBottom(); }).observe(thread); // follow all growth: text, tools, thinking

  // cyclic keyboard selection over a list of elements (shared by the slash menu and the fuzzy finder): moves the
  // selection by delta, applies the .sel class, scrolls it into view, and returns the new index.
  function cycleSelection(items, current, delta) {
    if (!items.length) return current;
    const next = (current + delta + items.length) % items.length;
    items.forEach((el, i) => el.classList.toggle("sel", i === next));
    items[next].scrollIntoView({ block: "nearest" });
    return next;
  }

  // ---- message construction ----
  function addMsg(role) {
    const m = document.createElement("div"); m.className = "msg " + role;
    const b = document.createElement("div"); b.className = "bubble";
    m.appendChild(b); thread.appendChild(m);
    return { msg: m, bubble: b };
  }
  function showActivity(text) {
    if (!activityBubble) {
      activityBubble = addMsg("assistant");
      activityBubble.msg.setAttribute("aria-busy", "true");
    }
    activityBubble.bubble.innerHTML = "";
    const row = document.createElement("div"); row.className = "activity"; row.textContent = text || "thinking...";
    activityBubble.bubble.appendChild(row);
    if (stick) toBottom();
  }
  function clearActivity() {
    if (!activityBubble) return;
    activityBubble.msg.remove();
    activityBubble = null;
  }
  function simple(role, text, images, files, ts) {
    const m = addMsg(role);
    withAutoScroll(() => {
      renderMarkdown(m.bubble, text);
      if (images && images.length) { // data URLs echoed by the server for a sent user message
        sessionModalities.add("image"); // track what's actually in the chat, so the downgrade toast can be relevant
        const wrap = document.createElement("div"); wrap.className = "imgs";
        images.forEach(url => { const im = document.createElement("img"); im.src = url; im.loading = "lazy"; wrap.appendChild(im); });
        m.bubble.appendChild(wrap);
      }
      if (files && files.length) { // non-image attachments shown as named chips
        const wrap = document.createElement("div"); wrap.className = "filerow";
        files.forEach(f => {
          sessionModalities.add(modalityOf(f.mime));
          const c = document.createElement("span"); c.className = "filechip";
          const ic = document.createElement("span"); ic.className = "ficon"; ic.textContent = fileGlyph(f.mime);
          const n = document.createElement("span"); n.className = "fname"; n.textContent = f.name || "file";
          c.append(ic, n); wrap.appendChild(c);
        });
        m.bubble.appendChild(wrap);
      }
    });
    if (role === "user") stampMsg(m.msg, ts);
    return m;
  }
  // A subtle timestamp shown on hover under a message — server ts on a resumed session, else arrival time now.
  function stampMsg(el, ts) {
    const t = new Date(typeof ts === "number" ? ts : Date.now());
    if (isNaN(t.getTime())) return;
    const time = document.createElement("time");
    time.className = "msg-time"; time.dateTime = t.toISOString();
    time.textContent = t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    time.title = t.toLocaleString();
    el.appendChild(time);
  }

  // discrete extension/command output, inline in the transcript
  // Ephemeral status feedback as a transient toast (kept OUT of the transcript, so e.g. /new leaves an empty
  // conversation that returns to the centered hero instead of a lingering "started a new conversation" note).
  const toasts = $("#toasts");
  function showToast(text, alert) {
    const t = document.createElement("div"); t.className = "toast" + (alert ? " alert" : ""); t.textContent = text;
    toasts.appendChild(t);
    setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 260); }, alert ? 4200 : 2600);
  }

  // current model + usage in the header (model switches and cost update live)
  function renderStats(d) {
    if (!d || !d.model) return;
    currentModel = d.model;
    modelHint.textContent = "Using " + d.model;
    if (Array.isArray(d.modalities)) {
      // on a real model switch to one that dropped media support, warn that existing attachments won't be sent to it
      if (lastModel !== null && d.model !== lastModel) {
        // only warn about lost modalities that are ACTUALLY in this chat (no point flagging "can't read pdf" with no pdf)
        const lost = modalities.filter(m => !d.modalities.includes(m) && sessionModalities.has(m));
        if (lost.length)
          showToast("Now on " + d.model + " — can't read " + lost.join(", ")
                                          + "; the " + lost.join("/") + " already in this chat won't be sent to it.", true);
      }
      modalities = d.modalities; // re-gate composer uploads for this model
      updateComposer();
    }
    lastModel = d.model;
    renderStatusLines(lastStatusLines);
  }
  // header status bar: the aggregated keyed statuses + status/footer lines, rendered as chips (mirrors the TUI)
  let lastStatusLines = [];
  function renderStatusLines(lines) {
    lastStatusLines = Array.isArray(lines) ? lines : [];
    badgesEl.innerHTML = "";
    if (currentModel) {
      const chip = document.createElement("span"); chip.className = "badge-chip model"; chip.textContent = currentModel;
      chip.title = "Switch model"; chip.setAttribute("role", "button"); chip.tabIndex = 0;
      const openModel = () => { input.value = "/model "; input.focus(); autoGrow(); updateMenu(); updateComposer(); };
      chip.addEventListener("click", openModel);
      chip.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openModel(); } });
      badgesEl.appendChild(chip);
    }
    for (const line of lastStatusLines) {
      if (!line || !line.trim()) continue;
      const chip = document.createElement("span"); chip.className = "badge-chip"; chip.textContent = line.trim();
      badgesEl.appendChild(chip);
    }
  }

  // a read-only viewer (e.g. /logs) as a collapsible block in the transcript
  function showViewer(d) {
    withAutoScroll(() => {
      const wrap = document.createElement("div"); wrap.className = "msg assistant";
      const det = document.createElement("details"); det.className = "tool"; det.open = true;
      const sum = document.createElement("summary"); sum.innerHTML = '<span class="name"></span>';
      sum.querySelector(".name").textContent = d.title || "viewer";
      const sec = document.createElement("div"); sec.className = "section";
      const pre = document.createElement("pre"); pre.textContent = (d.lines || []).join("\n");
      sec.appendChild(pre); det.append(sum, sec); wrap.appendChild(det); thread.appendChild(wrap);
    });
  }

  function thinkingBlock(parent) {
    const d = document.createElement("details"); d.className = "think";
    const sum = document.createElement("summary"); sum.textContent = "Thinking";
    const body = document.createElement("div"); body.className = "body";
    const copy = copyButton("think-copy", () => body.textContent, "Copy reasoning");
    copy.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); }); // copy, don't toggle the block
    // expanding it near the bottom would otherwise leave the revealed reasoning below the fold
    d.addEventListener("toggle", () => { if (d.open) d.scrollIntoView({ block: "nearest", behavior: "smooth" }); });
    sum.appendChild(copy);
    d.append(sum, body);
    parent.insertBefore(d, parent.firstChild); // reasoning renders ABOVE the answer (conventional), collapsed by default
    return body;
  }

  function assistantBubble() {
    return withAutoScroll(() => {
      const e = addMsg("assistant");
      // While streaming, mark the message busy so a screen reader waits for the settled text instead of re-announcing
      // the growing subtree on every animation frame; cleared when the turn finalizes (or the turn ends).
      e.msg.setAttribute("aria-busy", "true");
      const answer = document.createElement("div"); answer.className = "answer";
      const content = document.createElement("div"); answer.appendChild(content);
      e.bubble.appendChild(answer); // a thinking block, if any, is inserted ABOVE this
      return { msg: e.msg, wrap: e.bubble, answer, content, thinkBody: null, raf: 0, pending: "" };
    });
  }

  function updateAssistant(b, content, thinking, isFinal) {
    if (thinking && thinking.trim()) {
      if (!b.thinkBody) b.thinkBody = thinkingBlock(b.wrap);
      b.thinkBody.textContent = thinking;
    }
    b.pending = content; // always render the newest content when the frame fires (don't drop a later update)
    b.final = !!isFinal;
    if (!b.raf) b.raf = requestAnimationFrame(() => {
      b.raf = 0; withAutoScroll(() => renderMarkdown(b.content, b.pending, b.final));
      if (b.final) b.msg.setAttribute("aria-busy", "false"); // settled → announce the complete message once
      // once settled, float a copy at the answer's top-right (innerHTML rewrites b.content, so the button lives
      // on the sibling .answer wrapper, not inside it). The thinking block carries its own copy above. Skip it when
      // the answer leads with a code block — that block's own top-right copy is in the same spot (no double button).
      if (b.final && !b.copied && b.pending.trim()) {
        // decorateCodeBlock has wrapped a leading <pre> in <div class="codeblock"> by now, so check for that wrapper
        // (not PRE) — otherwise the code card's own top-right copy and this one would overlap.
        const lead = b.content.firstElementChild;
        if (!lead || !lead.classList.contains("codeblock"))
          b.answer.appendChild(copyButton("answer-copy", () => b.pending, "Copy response"));
        b.copied = true;
      }
    });
  }

  function toolCard(id, name, args, detail) {
    if (toolCards.has(id)) return toolCards.get(id);
    return withAutoScroll(() => {
      const wrap = document.createElement("div"); wrap.className = "msg assistant";
      const d = document.createElement("details"); d.className = "tool"; d.open = false;
      const sum = document.createElement("summary");
      sum.innerHTML = '<span class="name"></span><span class="detail"></span><span class="badge running">running…</span>';
      sum.querySelector(".name").textContent = name || "tool";
      sum.querySelector(".detail").textContent = detail || ""; // path / command / pattern — full text shown on expand
      d.appendChild(sum);
      const argEl = renderToolArgs(name, args, detail); // clean key/value; null when the header already shows it all
      if (argEl) { const argSec = document.createElement("div"); argSec.className = "section"; argSec.appendChild(argEl); d.appendChild(argSec); }
      const card = { wrap, details: d, badge: sum.querySelector(".badge") };
      wrap.appendChild(d); thread.appendChild(wrap);
      toolCards.set(id, card);
      return card;
    });
  }
  // Render a tool's args as a clean key/value list. Returns null when there's nothing worth showing — notably when the
  // summary detail already conveys the args (e.g. bash's {command} == the header command), so we don't repeat it as JSON.
  function renderToolArgs(name, argsJson, detail) {
    if (name === "question") return renderQuestionArgs(argsJson);
    const raw = (argsJson || "").trim();
    if (!raw || raw === "{}") return null;
    let data; try { data = JSON.parse(raw); } catch { const pre = document.createElement("pre"); pre.textContent = raw; return pre; }
    if (!data || typeof data !== "object" || Array.isArray(data)) { const pre = document.createElement("pre"); pre.textContent = raw; return pre; }
    const det = (detail || "").trim();
    const entries = Object.entries(data).filter(([, v]) => {
      const s = typeof v === "string" ? v.trim() : JSON.stringify(v);
      return !(det && s && (det === s || det.includes(s))); // drop args already shown in the summary detail
    });
    if (!entries.length) return null;
    const box = document.createElement("div"); box.className = "arglist";
    entries.forEach(([k, v]) => {
      const row = document.createElement("div"); row.className = "argrow";
      const key = document.createElement("span"); key.className = "argkey"; key.textContent = k;
      const val = document.createElement("span"); val.className = "argval";
      val.textContent = typeof v === "string" ? v : JSON.stringify(v);
      row.append(key, val); box.appendChild(row);
    });
    return box;
  }
  // Render the question tool's args as a readable list (question text + options), falling back to raw JSON if it can't parse.
  function renderQuestionArgs(argsJson) {
    let data;
    try { data = JSON.parse(argsJson || "{}"); } catch { const pre = document.createElement("pre"); pre.textContent = argsJson || ""; return pre; }
    const list = Array.isArray(data.questions) && data.questions.length ? data.questions
               : (data.question || data.text) ? [{ question: data.question || data.text, header: data.header, options: data.options, multiple: data.multiple }]
               : [];
    if (!list.length) { const pre = document.createElement("pre"); pre.textContent = argsJson || ""; return pre; }
    const box = document.createElement("div"); box.className = "qcard";
    list.forEach((q, i) => {
      const block = document.createElement("div"); block.className = "qcard-q";
      const title = document.createElement("div"); title.className = "qcard-title";
      title.textContent = (list.length > 1 ? (i + 1) + ". " : "") + (q.question || q.text || "")
                        + (q.multiple ? "  (choose any)" : "");
      block.appendChild(title);
      (q.options || []).forEach(o => {
        const opt = document.createElement("div"); opt.className = "qcard-opt";
        const label = typeof o === "string" ? o : (o.label || "");
        opt.textContent = "• " + label + (o && o.description ? " — " + o.description : "");
        block.appendChild(opt);
      });
      box.appendChild(block);
    });
    return box;
  }
  function toolResult(id, name, content, isError) {
    const card = toolCard(id, name, "", "");
    card.details.classList.toggle("err", !!isError);
    card.badge.classList.remove("running"); // stop the pulse once the tool settles
    card.badge.textContent = isError ? "error" : "done";
    const sec = document.createElement("div"); sec.className = "section";
    const pre = document.createElement("pre"); pre.textContent = content || "(no output)";
    sec.appendChild(pre); card.details.appendChild(sec);
  }

  // ---- SSE wiring ----
  let reconnectDelay = 1000, online = true;
  function setOnline(v) {
    if (v === online) return;
    online = v;
    document.body.classList.toggle("offline", !v);
    if (!v) showToast("Connection lost — reconnecting…", true);
  }
  function connect() {
    const es = new EventSource("/events");
    es.addEventListener("open", () => { conn.classList.add("on"); reconnectDelay = 1000; setOnline(true); });
    es.addEventListener("error", () => {
      conn.classList.remove("on");
      setOnline(false);
      // EventSource auto-retries while CONNECTING, but a CLOSED stream is terminal — reconnect ourselves (capped backoff).
      if (es.readyState === EventSource.CLOSED) {
        setTimeout(connect, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 2, 5000);
      }
    });

    es.addEventListener("history", e => {
      thread.innerHTML = ""; toolCards.clear(); live = null; activityBubble = null; sessionModalities.clear(); // replay re-populates it
      thread.classList.add("replaying"); // replayed messages land all at once — suppress the per-message rise so the whole log doesn't flash in
      try { for (const m of JSON.parse(e.data)) replayHistory(m); } finally { thread.classList.remove("replaying"); }
      main.scrollTop = main.scrollHeight;
    });
    es.addEventListener("user", e => { const d = JSON.parse(e.data); simple("user", d.content, d.images, d.files, d.ts); });
    es.addEventListener("stream_start", () => { showActivity("streaming..."); });
    es.addEventListener("assistant", e => {
      const d = JSON.parse(e.data);
      clearActivity();
      if (!live) live = assistantBubble();
      updateAssistant(live, d.content, d.thinking, d.final);
      if (d.final) { stampMsg(live.msg, d.ts); live = null; }
    });
    es.addEventListener("tool", e => { const d = JSON.parse(e.data); clearActivity(); toolCard(d.id, d.name, d.args, d.detail); live = null; showActivity("running tools..."); });
    es.addEventListener("tool_result", e => { const d = JSON.parse(e.data); toolResult(d.id, d.name, d.content, d.isError); });
    es.addEventListener("custom", e => {
      const d = JSON.parse(e.data); const el = addMsg("custom");
      if (d.type === "command") { el.bubble.classList.add("command"); el.bubble.textContent = d.content; }
      else renderMarkdown(el.bubble, d.content);
      main.scrollTop = main.scrollHeight;
    });
    es.addEventListener("agent_error", e => { simple("error", JSON.parse(e.data).message); });
    es.addEventListener("turn", e => setBusy(JSON.parse(e.data).busy));
    es.addEventListener("status", e => { const d = JSON.parse(e.data); if (d.message) showToast(d.message, d.alert); });
    es.addEventListener("statuslines", e => renderStatusLines(JSON.parse(e.data).lines || []));
    es.addEventListener("stats", e => renderStats(JSON.parse(e.data)));
    es.addEventListener("viewer", e => showViewer(JSON.parse(e.data)));
    es.addEventListener("dialog", e => showDialog(JSON.parse(e.data)));
    es.addEventListener("dialog_done", e => { const f = openDialogs.get(JSON.parse(e.data).id); if (f) f(); });
  }

  function replayHistory(m) {
    if (m.role === "assistant") {
      const b = assistantBubble();
      updateAssistant(b, m.content, m.thinking, true); // committed message → copy buttons now
      stampMsg(b.msg, m.ts);
      (m.toolCalls || []).forEach(tc => toolCard(tc.id, tc.name, tc.args, tc.detail));
      live = null;
    } else if (m.role === "tool") {
      toolResult(m.id, m.name, m.content, m.isError);
    } else if (m.role === "custom") {
      simple("custom", m.content);
    } else {
      simple(m.role, m.content, m.images, m.files, m.ts); // user message — restore its thumbnails / chips + time
    }
  }

  // ---- input / busy ----
  function setBusy(b) {
    busy = b;
    // turn ended without a final frame (error/interrupt): release the streaming bubble so AT still announces it
    if (!b && live) { live.msg.setAttribute("aria-busy", "false"); live = null; }
    if (!b) clearActivity();
    // any tool still "running…" when the turn ends (e.g. interrupted before its result) — stop the pulse
    if (!b) thread.querySelectorAll(".tool .badge.running").forEach(badge => {
      badge.classList.remove("running"); badge.textContent = "stopped";
    });
    document.title = b ? "● pijota" : "pijota"; // surface activity in a backgrounded tab
    conn.classList.toggle("busy", b);
    updateComposer(); // the send button's enabled-state + the Stop button are derived from busy + the draft
  }
  function autoGrow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 200) + "px"; }
  function postJSON(url, data) {
    const opts = { method: "POST" };
    if (data !== undefined) { opts.headers = { "Content-Type": "application/json" }; opts.body = JSON.stringify(data); }
    return fetch(url, opts);
  }
  function post(text, files) {
    postJSON("/prompt", { text, files: files || [] })
      .then(r => { if (!r.ok) showToast(r.status === 413 ? "Attachments too large — message not sent."
                                          : "Send failed (" + r.status + ").", true); })
      .catch(() => showToast("Couldn't reach the server — check your connection.", true));
  }
  function send() {
    const text = input.value.trim();
    if (!text && !pendingFiles.length) return;
    const files = pendingFiles.map(f => ({ mime: f.mime, data: f.data, filename: f.name }));
    input.value = ""; pendingFiles = []; renderAttachments(); autoGrow(); hideMenu();
    showActivity("thinking...");
    // Post immediately, even mid-stream: the server injects it into the running turn (session.followUp steers the
    // current task) and slash commands / interrupts take effect at once. Nothing is held client-side to lose on a
    // disconnect or to mis-fire after Stop — Stop just interrupts, with no pending text to flush.
    post(text, files);
    updateComposer();
    input.focus(); // keep the chat bar focused after clicking Send
  }

  // ---- file attachments (attach button / paste / drag-drop), gated to the model's modalities ----
  const attachEl = $("#attachments");
  const MAX_FILES = 8, MAX_FILE_BYTES = 5 * 1024 * 1024; // keep under provider limits (Anthropic ~5MB)
  // mirrors org.pijota.llm.Modality.fromMime — keep the two in sync
  function modalityOf(mime) {
    if (!mime) return "text";
    if (mime.startsWith("image/")) return "image";
    if (mime.startsWith("audio/")) return "audio";
    if (mime.startsWith("video/")) return "video";
    if (mime === "application/pdf") return "pdf";
    return "text"; // text / code / docx — extracted server-side, works on any model
  }
  // text (extracted server-side) and pdf (extracted via the web_pdf_to_markdown tool when the model isn't PDF-native) work
  // on any model; other media needs the model to declare the modality.
  function accepts(mime) { const m = modalityOf(mime); return m === "text" || m === "pdf" || modalities.includes(m); }
  // providers accept only JPEG/PNG/GIF/WebP — a provider/model limitation; HEIC/TIFF/BMP etc. are rejected (no transcode)
  const SUPPORTED_IMAGE = ["image/jpeg", "image/png", "image/gif", "image/webp"];
  function addFile(file) {
    if (!file) return;
    if (!accepts(file.type))
      return showToast((lastModel || "This model") + " can't read " + modalityOf(file.type)
                                           + " files — switch with /model.", true);
    if (modalityOf(file.type) === "image" && !SUPPORTED_IMAGE.includes(file.type.toLowerCase()))
      return showToast((file.name || "image") + ": that format isn't supported by " + (lastModel || "the current model")
                                           + " — use JPEG/PNG/GIF/WebP.", true);
    if (pendingFiles.length >= MAX_FILES) return showToast("Up to " + MAX_FILES + " files per message.", true);
    if (file.size > MAX_FILE_BYTES) return showToast((file.name || "file") + " is too large (max 5MB).", true);
    const r = new FileReader();
    r.onload = () => {
      const url = String(r.result), comma = url.indexOf(",");
      pendingFiles.push({ mime: file.type, data: url.slice(comma + 1), url, name: file.name || modalityOf(file.type),
                                          isImage: modalityOf(file.type) === "image" });
      renderAttachments(); updateComposer();
    };
    r.readAsDataURL(file);
  }
  function fileGlyph(mime) {
    const m = modalityOf(mime);
    return m === "pdf" ? "📄" : m === "audio" ? "🎧" : m === "video" ? "🎬" : "📎";
  }
  function renderAttachments() {
    attachEl.replaceChildren();
    pendingFiles.forEach((f, i) => {
      const rm = document.createElement("button"); rm.className = "rm"; rm.textContent = "✕"; rm.title = "Remove";
      rm.onclick = () => { pendingFiles.splice(i, 1); renderAttachments(); updateComposer(); input.focus(); };
      if (f.isImage) {
        const t = document.createElement("div"); t.className = "thumb";
        const im = document.createElement("img"); im.src = f.url; im.alt = f.name;
        t.append(im, rm); attachEl.appendChild(t);
      } else {
        const c = document.createElement("div"); c.className = "filechip"; c.title = f.name;
        const ic = document.createElement("span"); ic.className = "ficon"; ic.textContent = fileGlyph(f.mime);
        const n = document.createElement("span"); n.className = "fname"; n.textContent = f.name;
        c.append(ic, n, rm); attachEl.appendChild(c);
      }
    });
  }
  input.addEventListener("paste", e => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const it of items)
      if (it.kind === "file") { const f = it.getAsFile(); if (f) { e.preventDefault(); addFile(f); } }
  });
  ["dragenter", "dragover"].forEach(ev => composerInner.addEventListener(ev,
                                  e => { e.preventDefault(); $(".composer").classList.add("dragover"); }));
  composerInner.addEventListener("dragleave", () => $(".composer").classList.remove("dragover"));
  composerInner.addEventListener("drop", e => {
    e.preventDefault();
    $(".composer").classList.remove("dragover");
    const files = e.dataTransfer && e.dataTransfer.files;
    if (files) for (const f of files) addFile(f);
  });
  // attach (📎) button → hidden native file picker
  const fileInput = document.createElement("input");
  fileInput.type = "file"; fileInput.multiple = true; fileInput.style.display = "none";
  document.body.appendChild(fileInput);
  fileInput.addEventListener("change", () => { for (const f of fileInput.files) addFile(f); fileInput.value = ""; });
  const attachBtn = $("#attach");
  attachBtn.addEventListener("click", () => fileInput.click());

  // The send button stays in one fixed slot (↑), disabled when empty; Stop is the separate round button shown only
  // while streaming. Sending mid-stream posts right away, so there is no queued/pending state to render.
  function updateComposer() {
    sendBtn.disabled = !input.value.trim() && !pendingFiles.length;
    stopBtn.classList.toggle("show", busy);
    attachBtn.classList.toggle("show", true); // text + pdf attach on any model; media gates per-file in addFile()
  }

  // command palette: a fuzzy finder over every command, opened with ⌘K / Ctrl-K
  function commandPalette() {
    if (!commands.length || document.querySelector(".overlay")) return;
    const { overlay, modal, close } = openOverlay("finder");
    overlay.addEventListener("click", e => { if (e.target === overlay) close(); }); // tap backdrop to dismiss (mobile)
    modal.appendChild(closeButton(close));
    const h = document.createElement("h3"); h.textContent = "Run a command"; modal.appendChild(h);
    const labels = commands.map(c => c.description ? c.name + "  —  " + c.description : c.name);
    buildFinder(modal, labels, i => { close(); post(commands[i].name); }, close);
  }
  // builds the overlay + modal shell and mounts it; callers fill the modal and call close() to dismiss. close()
  // returns focus to the chat bar explicitly — removing the focused dialog input does NOT reliably fire focusout
  // in every browser, so the sticky-focus handler can't be relied on to snap focus back on its own.
  function openOverlay(modalClass) {
    const overlay = document.createElement("div"); overlay.className = "overlay";
    const modal = document.createElement("div"); modal.className = "modal" + (modalClass ? " " + modalClass : "");
    overlay.appendChild(modal); document.body.appendChild(overlay);
    return { overlay, modal, close: () => { overlay.remove(); refocusChat(); } };
  }
  // focus an element once it's mounted and painted (deferred a tick so newly-inserted dialog inputs take focus)
  function focusSoon(el) { setTimeout(() => el.focus(), 0); }
  document.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")) { e.preventDefault(); commandPalette(); }
  });

  // sticky focus: pull focus back to the chat bar when it lands on nothing interactive — but never while a
  // dialog is open (its search/input wants focus) or while the user is selecting text in the transcript.
  function refocusChat() {
    if (document.querySelector(".overlay")) return;
    if (window.getSelection && String(window.getSelection())) return;
    input.focus();
  }
  document.addEventListener("focusout", () => setTimeout(() => {
    const a = document.activeElement;
    // Hold focus only for real text fields and anything inside an open dialog. Everything else that can grab
    // focus here — buttons, <summary> toggles, links, or clicked empty space — is transient, so snap the chat
    // bar back. (refocusChat still bows out while text is being selected.)
    if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.closest(".overlay"))) return;
    refocusChat();
  }, 0));

  // slash-command menu: shown while the whole input is a single "/token" (no space yet)
  function updateMenu() {
    const m = /^\/(\S*)$/.exec(input.value);
    if (!m) return hideMenu();
    const q = m[1].toLowerCase();
    menuItems = commands.filter(c => c.name.slice(1).toLowerCase().startsWith(q));
    if (!menuItems.length) return hideMenu();
    menuSel = 0; slash.innerHTML = "";
    menuItems.forEach((c, i) => {
      const it = document.createElement("div"); it.className = "item" + (i === 0 ? " sel" : "");
      it.innerHTML = '<span class="cmd"></span><span class="desc"></span>';
      it.querySelector(".cmd").textContent = c.name;
      it.querySelector(".desc").textContent = c.description || "";
      // tapping a command runs it (complete + send) — matches the desktop Enter-on-selection, and is the only way to
      // run a command on mobile, where the textarea's return key inserts a newline rather than submitting. Use Tab
      // (desktop) to complete without sending when you want to add arguments.
      it.onclick = () => { completeMenu(i); send(); };
      slash.appendChild(it);
    });
    slash.classList.add("show");
  }
  function hideMenu() { slash.classList.remove("show"); menuItems = []; menuSel = -1; }
  function moveSel(d) { menuSel = cycleSelection([...slash.children], menuSel, d); }
  function completeMenu(i) { input.value = menuItems[i].name + " "; hideMenu(); input.focus(); autoGrow(); }

  sendBtn.addEventListener("click", send); // always send (never Stop); posts immediately, even mid-stream
  stopBtn.addEventListener("click", () => postJSON("/interrupt")); // Stop is its own control, above the composer
  input.addEventListener("input", () => { autoGrow(); updateMenu(); updateComposer(); });
  document.querySelectorAll(".example").forEach(ex => // clickable example prompts on the empty landing send on click
    ex.addEventListener("click", () => { input.value = ex.textContent; send(); }));
  input.addEventListener("keydown", e => {
    if (slash.classList.contains("show")) {
      if (e.key === "ArrowDown") { e.preventDefault(); return moveSel(1); }
      if (e.key === "ArrowUp") { e.preventDefault(); return moveSel(-1); }
      if (e.key === "Tab") { e.preventDefault(); return completeMenu(menuSel); } // complete, stay to add args
      if (e.key === "Enter" && menuSel >= 0) { e.preventDefault(); completeMenu(menuSel); send(); return; } // complete + run
      if (e.key === "Escape") { e.preventDefault(); return hideMenu(); }
    }
    // Desktop: Enter sends, Shift+Enter = newline. Touch: Enter = newline (no Shift on phones) — the button sends.
    if (e.key === "Enter" && !e.shiftKey && !isTouch) { e.preventDefault(); send(); }
  });

  // ---- dialogs (confirm / prompt / select) ----
  const openDialogs = new Map(); // id → dismiss(); lets a replayed dialog dedupe and dialog_done close it across tabs
  function showDialog(d) {
    if (d.id && openDialogs.has(d.id)) return; // already on screen (e.g. replayed on connect, or a duplicate event)
    const { overlay, modal, close } = openOverlay(d.kind === "select" ? "finder" : "");
    const dismiss = () => { if (d.id) openDialogs.delete(d.id); close(); };
    if (d.id) openDialogs.set(d.id, dismiss);
    const answer = v => { postJSON("/answer", { id: d.id, value: v }); dismiss(); };
    // mobile has no Esc: tapping the dimmed backdrop cancels. confirm/prompt resolve to a safe default so the agent
    // never hangs; select just dismisses; question submits its current state (set below). Mutable so a branch can swap it.
    let onCancel = d.kind === "confirm" ? () => answer("no")
                 : d.kind === "prompt" ? () => answer(d.default || "")
                 : dismiss;
    overlay.addEventListener("click", e => { if (e.target === overlay) onCancel(); });
    modal.appendChild(closeButton(() => onCancel()));
    const h = document.createElement("h3"); h.textContent = d.question || d.title || ""; modal.appendChild(h);

    if (d.kind === "confirm") {
      const row = document.createElement("div"); row.className = "row";
      const no = button("No", "act secondary"), yes = button("Yes", "act");
      no.onclick = () => answer("no"); yes.onclick = () => answer("yes");
      row.append(no, yes); modal.appendChild(row);
      modal.tabIndex = 0; focusSoon(modal);
      modal.addEventListener("keydown", e => { if (e.key === "Escape") answer("no"); });
    } else if (d.kind === "prompt") {
      const inp = document.createElement("input"); inp.value = d.default || "";
      inp.addEventListener("keydown", e => {
        if (e.key === "Enter") answer(inp.value);
        else if (e.key === "Escape") answer(d.default || ""); // cancel → the default, so the agent never hangs
      });
      const row = document.createElement("div"); row.className = "row";
      const ok = button("OK", "act"); ok.onclick = () => answer(inp.value);
      row.append(ok); modal.append(inp, row); focusSoon(inp);
    } else if (d.kind === "select") {
      buildFinder(modal, d.options || [], i => answer(String(i)), onCancel);
    } else if (d.kind === "question") {
      // one form for all questions: option buttons (multi-select when `multiple`) plus a free-text field per question.
      h.textContent = (d.questions || []).length > 1 ? "A few questions" : "";
      const state = (d.questions || []).map(() => ({ picked: new Set(), text: "" }));
      const form = document.createElement("div"); form.className = "qform";
      (d.questions || []).forEach((q, qi) => {
        const block = document.createElement("div"); block.className = "qblock";
        if (q.header) { const lbl = document.createElement("div"); lbl.className = "qheader"; lbl.textContent = q.header; block.appendChild(lbl); }
        const qt = document.createElement("div"); qt.className = "qtext"; qt.textContent = q.question; block.appendChild(qt);
        (q.options || []).forEach(opt => {
          const b = button(opt, "opt"); b.classList.add("qopt");
          b.onclick = () => {
            if (q.multiple) {
              b.classList.toggle("on");
              state[qi].picked.has(opt) ? state[qi].picked.delete(opt) : state[qi].picked.add(opt);
            } else {
              block.querySelectorAll(".qopt").forEach(x => x.classList.remove("on"));
              b.classList.add("on"); state[qi].picked = new Set([opt]);
            }
          };
          block.appendChild(b);
        });
        const inp = document.createElement("input"); inp.className = "qinput";
        inp.placeholder = (q.options || []).length ? "…or type a custom answer" : "Type your answer";
        inp.addEventListener("input", () => state[qi].text = inp.value);
        block.appendChild(inp);
        form.appendChild(block);
      });
      // when options overflow the scroll area, a ↓ floats at its corner to jump straight to the bottom (free-text + Submit)
      const wrap = document.createElement("div"); wrap.className = "qform-wrap";
      const jump = document.createElement("button");
      jump.type = "button"; jump.className = "qjump"; jump.textContent = "↓"; jump.title = "Jump to the bottom";
      jump.onclick = () => form.scrollTo({ top: form.scrollHeight, behavior: "smooth" });
      const updateJump = () => jump.classList.toggle("show", form.scrollHeight - form.scrollTop - form.clientHeight > 16);
      form.addEventListener("scroll", updateJump);
      wrap.append(form, jump); modal.appendChild(wrap);
      setTimeout(updateJump, 0); // after layout: reveal only if the content actually overflows
      const submit = () => answer((d.questions || []).map((q, qi) => {
        const typed = state[qi].text.trim();
        const ans = typed || [...state[qi].picked].join(", ");
        return q.question + " → " + (ans || "(no answer)");
      }).join("\n"));
      onCancel = submit; // backdrop / ✕ / Esc submit the current state so the agent never hangs
      const row = document.createElement("div"); row.className = "row";
      const ok = button("Submit", "act"); ok.onclick = submit; row.appendChild(ok); modal.appendChild(row);
      modal.tabIndex = 0; focusSoon(modal);
      modal.addEventListener("keydown", e => {
        if (e.key === "Escape") submit();
        else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) submit();
      });
    }
  }
  function button(text, cls) { const b = document.createElement("button"); b.className = cls; b.textContent = text; return b; }
  // a small ✕ pinned to the modal's top-right — the standard, keyboard-clear way to dismiss a dialog (mobile has no Esc)
  function closeButton(onClose) {
    const b = document.createElement("button"); b.type = "button"; b.className = "modal-close";
    b.textContent = "✕"; b.setAttribute("aria-label", "Close"); b.onclick = onClose; return b;
  }

  // a fuzzy finder: search box + filtered, keyboard-navigable list (↑/↓ move, Enter pick, Esc cancel)
  function buildFinder(modal, options, onPick, onCancel) {
    const search = document.createElement("input"); search.placeholder = "Type to filter…";
    const list = document.createElement("div"); list.className = "finder-list";
    modal.append(search, list);
    let matches = [], sel = 0;
    function render() {
      const q = search.value.trim().toLowerCase();
      // score then sort: prefix beats substring (earlier position wins) beats scattered subsequence; ties keep
      // the original order (e.g. session recency). This pulls "/model" above "/plan"/"/mcp" when typing "model".
      matches = options.map((label, i) => ({ label, i, score: matchScore(q, label) }))
                                        .filter(o => o.score < Infinity)
                                        .sort((a, b) => a.score - b.score || a.i - b.i);
      sel = 0; list.innerHTML = "";
      if (!matches.length) { const e = document.createElement("div"); e.className = "finder-empty"; e.textContent = "no matches"; list.appendChild(e); return; }
      matches.forEach((m, idx) => {
        const el = document.createElement("div"); el.className = "finder-item" + (idx === 0 ? " sel" : "");
        el.textContent = m.label;
        el.onclick = () => onPick(m.i);
        list.appendChild(el);
      });
    }
    function move(delta) { sel = cycleSelection([...list.querySelectorAll(".finder-item")], sel, delta); }
    search.addEventListener("input", render);
    search.addEventListener("keydown", e => {
      if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
      else if (e.key === "Enter") { e.preventDefault(); if (matches.length) onPick(matches[sel].i); }
      else if (e.key === "Escape") { e.preventDefault(); onCancel(); }
    });
    render(); focusSoon(search);
  }
  // rank a label against a (lowercased) query: 0 = prefix, 1+ = substring (earlier position is better),
  // 1000 = scattered subsequence, Infinity = no match. Empty query matches everything (score 0).
  function matchScore(q, label) {
    if (!q) return 0;
    const t = label.toLowerCase();
    const idx = t.indexOf(q);
    if (idx === 0) return 0;
    if (idx > 0) return 1 + idx / 1000;
    let qi = 0;
    for (let ti = 0; ti < t.length && qi < q.length; ti++) if (t[ti] === q[qi]) qi++;
    return qi === q.length ? 1000 : Infinity;
  }

  autoGrow(); updateComposer(); connect(); input.focus();
});
</script>
</body>
</html>
